# The plan's full user-level sample (2,000 users, >= 3 conversations each) with the Fireworks LLM
# detector. About $12 with gpt-oss-120b; sample_turns is the spend cap.
#
#   export FIREWORKS_API_KEY=...
#   residpii run --config configs/fireworks_users_2000.yaml --datasets wildchat
extends: user_level.yaml
run_name: fireworks_users_2000

llm:
  enabled: true
  backend: fireworks
  model: accounts/fireworks/models/gpt-oss-120b
  # This sends sampled user text to Fireworks. Switched on by Ethan on 2026-10-12;
  # keep it on only while the dataset terms, your instructor/IRB and your partner allow it.
  allow_hosted: true
  sample_turns: 56000        # spend cap (about $14): whole users are kept until this many user turns
  concurrency: 8
  prompt_version: v1         # the prompt these results were produced with
  extract_spans: false
