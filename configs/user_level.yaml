# Stage 2 (per-user identifiability): a uniform sample of users with >= min_conversations, all their
# conversations (up to the cap) kept together. Datasets without a user proxy (lmsys) are skipped.
#
#   residpii run             --config configs/user_level.yaml
#   residpii llm-detect      --config configs/user_level.yaml --estimate        # cost, no API calls
#   residpii llm-detect      --config configs/user_level.yaml --allow-hosted --max-cost 20
#   residpii identifiability run --config configs/user_level.yaml
extends: default.yaml
run_name: user_level

datasets:
  arena: {enabled: false}      # judge is a weak proxy; enable to compare
  lmsys: {enabled: false}      # no user proxy

sampling:
  mode: user_level

user_level:
  n_users: 2000
  min_conversations: 3
  max_conversations_per_user: 50   # cap heavy users / shared IPs; a random subset is kept above the cap

labeling:
  datasets: [wildchat]           # datasets llm-detect and identifiability act on by default

uniqueness:
  max_combination_size: 4
  # Uniqueness is measured within the sample and falls as the sample grows; these subsample sizes
  # (those smaller than the sample) are reported alongside the full sample to show the trend.
  sample_sizes: [500, 1000]
  subsample_draws: 20
  # Model-based estimate among all eligible users (uniqueness_population.csv).
  population_prior: 0.5          # pseudo-users added to each cell count, so a value seen once is not "never"
  population_bootstrap_reps: 200
  linkage_splits: 20             # random split-half repetitions averaged in linkage.csv

identifiability:
  min_cell: 10                   # counts of 1..min_cell-1 users are blanked in every published table

# User-level adversarial sanitizer (`residpii adversarial`, src/residpii/user_adversarial.py). Hosted,
# opt-in. Models, effort and the confidence threshold come from `sanitizer:` in default.yaml.
adversarial:
  k: 5                         # stop once the user's smallest class (vs the Stage 2 sample) is >= k
  strict_k: 10                 # user_level_strict: both attackers must put the user in a class >= this
  max_rounds: 6                # targeted rounds per user
  max_tries_per_attribute: 2   # then the attribute is left as it is
  max_edit_share: 0.5          # reject a rewrite that changes more than this share of the message
  min_utility: 4               # reject a rewrite the judge rates below this (1-5)
  max_rewrite_chars: 8000      # longer messages are not rewritten (counted as too_long)
  eval_max_chars: 60000        # held-out attacker reads at most this much of a user's history
  pilot_at_risk: 40
  pilot_control: 10
