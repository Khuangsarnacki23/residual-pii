# Full-run configuration. Smoke runs extend this file (see smoke.yaml).
run_name: default
seed: 20261012

# Raw sampled text and masked span stores live here, OUTSIDE the repo, with 0700 permissions.
data_root: ~/.residual-pii
# Aggregate-only outputs (tables, figures, methods, disclosure drafts). Safe to commit.
results_dir: results

# Conversation-level language filter, using each dataset's own language field.
# Set to null to keep all languages (the pipeline itself is language-agnostic).
languages: [English]

datasets:
  wildchat:
    enabled: true
    repo: allenai/WildChat-1M
    revision: 7d6490e462285cf85d91eabea0f9a954fbddcd1f
    sample_size: 5000
  arena:
    enabled: true
    repo: lmsys/chatbot_arena_conversations
    revision: 1b6335d42a1d2c7e34870c905d03ab964f7f2bd8
    sample_size: 5000
  lmsys:
    enabled: true
    repo: lmsys/lmsys-chat-1m
    revision: 200748d9d3cddcc9d782887541057aca0b18c5da
    sample_size: 5000

# Limits on how much of each dataset the metadata scan reads (null = everything).
# Data is always streamed column-by-column from the Hub; nothing is downloaded in full.
scan:
  max_files: null
  max_row_groups_per_file: null

sampling:
  one_per_user: true          # applies where the dataset has a user proxy (WildChat hashed_ip, Arena judge)
  strata: [month, turn_bucket]  # strata a dataset lacks (e.g. lmsys has no timestamp) are skipped
  turn_bucket_edges: [1, 2, 4]  # buckets: 1, 2-3, 4+

# Regexes for each dataset's own redaction placeholders. Detections overlapping a placeholder
# are excluded from residual counts; placeholder frequency is reported separately.
# Run `residpii placeholders` to discover candidate formats before trusting these.
placeholders:
  common:
    - '\bNAME_\d+\b'
    - '\bPRESIDIO_ANONYMIZED_[A-Z_]+\b'
  wildchat:
    - '<PRESIDIO_ANONYMIZED_[A-Z_]+>'   # confirmed on redacted WildChat turns
  arena: []
  lmsys: []

presidio:
  spacy_model: en_core_web_lg
  # Detections are stored down to store_threshold; score_threshold is applied at analysis time,
  # so it can be changed (and a sensitivity table is produced) without re-running Presidio.
  # Note: under Presidio defaults a phone number without nearby context words scores 0.4.
  store_threshold: 0.3
  score_threshold: 0.5
  sensitivity_thresholds: [0.3, 0.4, 0.5, 0.7, 0.85]
  # Presidio's default spaCy setup ignores ORGANIZATION (very noisy); keep false to mirror the
  # out-of-the-box configuration WildChat most likely used.
  include_organization: false
  entities: [PERSON, EMAIL_ADDRESS, PHONE_NUMBER, LOCATION, DATE_TIME, NRP, URL, IP_ADDRESS,
             CREDIT_CARD, IBAN_CODE, US_SSN, US_BANK_NUMBER, US_PASSPORT, US_DRIVER_LICENSE,
             US_ITIN, CRYPTO, MEDICAL_LICENSE, UK_NHS]
  chunk_chars: 5000
  chunk_overlap: 200
  max_chars_per_turn: 50000   # text beyond this is not scanned; the truncated volume is reported

secrets:
  enabled: true

analysis:
  bootstrap_reps: 1000
  ci_level: 0.95

dedup:
  shingle_words: 3
  num_perm: 128
  bands: 16
  jaccard_threshold: 0.8

# Human-labelled benchmark (`residpii label ...`). Annotators label user turns blind: they never see
# detector output. Labels live under the restricted directory; only aggregate scores leave it.
labeling:
  datasets: [wildchat, lmsys, arena]   # each gets its own label set
  n_items: 300
  # Turns longer than this are not eligible (pasted documents); the excluded share is reported.
  max_chars: 4000
  # Strata by what the stored detectors flagged in the turn. `share` is the fraction of the label set;
  # oversampling rare strata is corrected by inclusion weights, so precision/recall stay unbiased.
  strata:
    rare_direct: {share: 0.20}   # email, phone, account/ID number, IP address, API key/credential
    name:        {share: 0.35}   # a name and no rare direct identifier
    quasi_only:  {share: 0.20}   # location/date/NRP/URL but no direct identifier
    none:        {share: 0.25}   # nothing flagged: needed to estimate recall
  annotators: [kai, ethan]
  adjudicator: adjudicated
  host: 127.0.0.1
  port: 8765
  # Gold span categories. Detector categories are mapped onto these for scoring (see `detector_map`).
  span_categories:
    direct: [name, email, phone, account_id, ip_address, api_key_token, street_address,
             username_handle, personal_url, date_of_birth]
    quasi:  [location, date, organization, occupation, age, nrp, education, health, other_quasi]
  # Whose information a span is. Only `self` and `third_party` count as real (private) PII.
  whose: [self, third_party, public_figure, fictional, not_personal, unclear]
  private_whose: [self, third_party]
  # Per-user attributes (Step 2 profiles), each marked stated or inferred.
  attributes: [age_band, gender, location_country, location_region, occupation, employer,
               education, relationship, health, nationality_ethnicity, religion, political, income]
  detector_map:
    name: name
    email: email
    phone: phone
    account_id: account_id
    ip_address: ip_address
    api_key_token: api_key_token
    url: personal_url
    location: location
    date: date
    nrp: nrp
    organization: organization
  # Span matching: a detector span matches a gold span if they overlap by at least this share of
  # the shorter span (0 = any overlap).
  min_overlap: 0.5
