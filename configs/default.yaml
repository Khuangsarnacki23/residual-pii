# Full-run configuration. Smoke runs extend this file (see smoke.yaml).
run_name: default
seed: 20261012

# Raw sampled text and masked span stores live here, OUTSIDE the repo, with 0700 permissions.
data_root: ~/.residual-pii
# Aggregate-only outputs (tables, figures, methods, disclosure drafts). Safe to commit.
results_dir: results

# Conversation-level language filter, using each dataset's own language field.
# Set to null to keep all languages (the pipeline itself is language-agnostic).
languages: [English]

datasets:
  wildchat:
    enabled: true
    repo: allenai/WildChat-1M
    revision: 7d6490e462285cf85d91eabea0f9a954fbddcd1f
    sample_size: 5000
  arena:
    enabled: true
    repo: lmsys/chatbot_arena_conversations
    revision: 1b6335d42a1d2c7e34870c905d03ab964f7f2bd8
    sample_size: 5000
  lmsys:
    enabled: true
    repo: lmsys/lmsys-chat-1m
    revision: 200748d9d3cddcc9d782887541057aca0b18c5da
    sample_size: 5000

# Limits on how much of each dataset the metadata scan reads (null = everything).
# Data is always streamed column-by-column from the Hub; nothing is downloaded in full.
scan:
  max_files: null
  max_row_groups_per_file: null

# Turn roles to fetch and scan. [user, assistant] adds the assistant's replies: they give the LLM
# detector its context and get their own prevalence_by_role table. Prevalence tables stay user-only.
roles: [user]

# Published tables blank any cell backed by fewer than this many users (new user-level tables).
publication:
  min_cell: 10

sampling:
  mode: per_user_one_conv     # one conversation per user proxy; alternative: user_level (see below)
  one_per_user: true          # applies where the dataset has a user proxy (WildChat hashed_ip, Arena judge)
  strata: [month, turn_bucket]  # strata a dataset lacks (e.g. lmsys has no timestamp) are skipped
  turn_bucket_edges: [1, 2, 4]  # buckets: 1, 2-3, 4+

# Used when sampling.mode is user_level: a uniform sample of users, each with their conversations.
# Datasets without a user proxy (lmsys) are skipped in that mode.
user_level:
  n_users: 2000
  min_conversations: 3
  max_conversations_per_user: 50   # cap heavy users / shared IPs; a random subset is kept above the cap

# Regexes for each dataset's own redaction placeholders. Detections overlapping a placeholder
# are excluded from residual counts; placeholder frequency is reported separately.
# Run `residpii placeholders` to discover candidate formats before trusting these.
placeholders:
  # Discovery only reports a token shape seen in at least this many distinct conversations.
  discovery_min_conversations: 5
  common:
    - '\bNAME_\d+\b'
    - '\bPRESIDIO_ANONYMIZED_[A-Z_]+\b'
  wildchat:
    - '<PRESIDIO_ANONYMIZED_[A-Z_]+>'   # confirmed on redacted WildChat turns
  arena: []
  lmsys: []

presidio:
  spacy_model: en_core_web_lg
  # Detections are stored down to store_threshold; score_threshold is applied at analysis time,
  # so it can be changed (and a sensitivity table is produced) without re-running Presidio.
  # Note: under Presidio defaults a phone number without nearby context words scores 0.4.
  store_threshold: 0.3
  score_threshold: 0.5
  sensitivity_thresholds: [0.3, 0.4, 0.5, 0.7, 0.85]
  # Presidio's default spaCy setup ignores ORGANIZATION (very noisy); keep false to mirror the
  # out-of-the-box configuration WildChat most likely used.
  include_organization: false
  entities: [PERSON, EMAIL_ADDRESS, PHONE_NUMBER, LOCATION, DATE_TIME, NRP, URL, IP_ADDRESS,
             CREDIT_CARD, IBAN_CODE, US_SSN, US_BANK_NUMBER, US_PASSPORT, US_DRIVER_LICENSE,
             US_ITIN, CRYPTO, MEDICAL_LICENSE, UK_NHS]
  chunk_chars: 5000
  chunk_overlap: 200
  max_chars_per_turn: 50000   # text beyond this is not scanned; the truncated volume is reported

secrets:
  enabled: true

# Rule-based self-introductions ("my name is X", "call me X"); reported as detector `selfid`.
selfid:
  enabled: true

# LLM detector for quasi-identifiers (stated and inferred). Off by default.
# The local backend keeps user text on this machine. A hosted backend sends it to a third party:
# the run aborts unless allow_hosted is true, and that needs the dataset terms, the instructor/IRB
# and both partners to agree.
llm:
  enabled: false
  backend: ollama            # ollama | anthropic | openai
  model: llama3.1:8b         # e.g. qwen2.5:7b-instruct; for a hosted backend, a current model name
  allow_hosted: false        # MUST be true for anthropic/openai (or a non-local ollama_url)
  ollama_url: http://localhost:11434/api/chat
  temperature: 0             # not sent to the anthropic backend, whose current models reject it
  anthropic_effort: low      # anthropic backend only; null for models without the effort setting
  max_turn_chars: 6000       # longer turns are cut here; the count is in llm_run_stats.csv
  max_context_chars: 1500    # the preceding turn, given as context only
  sample_turns: 2000         # LLM runs on a subsample (whole users in user_level mode); null = all
  concurrency: 1             # >1 only for hosted backends
  timeout_s: 300
  prompt_version: v1         # configs/prompts/qi_extract_<version>.txt
  min_confidence: 0.6        # attributes below this are left out of per-user profiles

# Per-user uniqueness of coarsened quasi-identifier profiles (needs llm.enabled).
uniqueness:
  max_combination_size: 4
  # Uniqueness is measured within the sample and falls as the sample grows; these subsample sizes
  # (those smaller than the sample) are reported alongside the full sample to show the trend.
  sample_sizes: [500, 1000, 2000]
  subsample_draws: 20

# Hand labeling (residpii label-export / label-score).
label:
  max_text_chars: 5000       # exported turn text is cut here; spans beyond it are not scored
  match_min_overlap: 0.5     # a detector span matches a gold span when they share >= this much of the shorter one

analysis:
  bootstrap_reps: 1000
  ci_level: 0.95

dedup:
  shingle_words: 3
  num_perm: 128
  bands: 16
  jaccard_threshold: 0.8
