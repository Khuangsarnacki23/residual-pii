# Deterministic coarsening maps for per-user profiles (src/residpii/profiles.py).
# Raw LLM values are matched after normalisation (lower-case, punctuation removed). Anything that
# does not match becomes `unknown`, so a free-text value can never make a user look unique.
# Employer type, school, relationship status, nationality and native language have no table here
# and are kept as stated.
# These tables are deliberately small and English/US-centred; see docs/limitations.md.

age_band_years: 10
age_top_code: 80            # ages at or above this share one band

# "AB:name" pairs by US census region. Profiles keep the state.
us_census_regions:
  northeast: ["CT:connecticut", "ME:maine", "MA:massachusetts", "NH:new hampshire", "RI:rhode island",
              "VT:vermont", "NJ:new jersey", "NY:new york", "PA:pennsylvania"]
  midwest:   ["IL:illinois", "IN:indiana", "MI:michigan", "OH:ohio", "WI:wisconsin", "IA:iowa", "KS:kansas",
              "MN:minnesota", "MO:missouri", "NE:nebraska", "ND:north dakota", "SD:south dakota"]
  south:     ["DE:delaware", "FL:florida", "GA:georgia", "MD:maryland", "NC:north carolina",
              "SC:south carolina", "VA:virginia", "DC:district of columbia", "WV:west virginia",
              "AL:alabama", "KY:kentucky", "MS:mississippi", "TN:tennessee", "AR:arkansas",
              "LA:louisiana", "OK:oklahoma", "TX:texas"]
  west:      ["AZ:arizona", "CO:colorado", "ID:idaho", "MT:montana", "NV:nevada", "NM:new mexico",
              "UT:utah", "WY:wyoming", "AK:alaska", "CA:california", "HI:hawaii", "OR:oregon",
              "WA:washington"]

