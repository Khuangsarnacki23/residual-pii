# First matching pattern wins (case-insensitive search on the normalised value).
# Fine levels: less_than_high_school, high_school, some_college, bachelors, graduate.
education_level:
  - [graduate, '\b(?:phd|ph d|doctorate|doctoral|master|masters|mba|msc|md|jd|postgrad\w*|graduate (?:student|school|degree)|grad (?:student|school))\b']
  - [high_school, '\b(?:high school|highschool|secondary|ged|a levels?|sixth form|12th grade|11th grade|10th grade|9th grade)\b']
  - [less_than_high_school, '\b(?:middle school|elementary|primary school|junior high|[1-8](?:st|nd|rd|th) grade)\b']
  - [bachelors, '\b(?:bachelor\w*|undergraduate degree|college degree|university degree|ba|bs|bsc|beng|college graduate|graduated college)\b']
  - [some_college, '\b(?:undergrad\w*|college student|university student|freshman|sophomore|junior|senior|associate\w*|some college|in college|in university|community college)\b']
# A school name or kind implies a level (current attendance, so "some_college" for a university).
school:
  - [graduate, '\b(?:graduate school|grad school|law school|medical school|med school|business school)\b']
  - [high_school, '\b(?:high school|highschool|secondary school|gymnasium|lycee|sixth form)\b']
  - [less_than_high_school, '\b(?:middle school|elementary school|primary school|junior high)\b']
  - [some_college, '\b(?:university|college|institute of technology|polytechnic|community college)\b']
# Fallback when the LLM gives no usable SOC code: first matching pattern wins.
# [pattern, major group, optional minor group]. Codes are llm.OCCUPATION_GROUPS.
occupation_keywords:
  - ['\b(?:retired|retiree|unemployed|homemaker|stay at home|housewife|between jobs)\b', NW]
  - ['\b(?:student|pupil|undergrad\w*|phd candidate|schoolboy|schoolgirl)\b', ST]
  - ['\b(?:nursing assistant|caregiver|medical assistant|home health|orderly)\b', "31"]
  - ['\b(?:software|developer|programmer|web dev\w*|devops|sysadmin|system administrator)\b', "15", "15-1"]
  - ['\b(?:data scien\w*|data analyst|statistician|machine learning|it support|qa|cyber\w*|database)\b', "15"]
  - ['\b(?:nurse|doctor|physician|surgeon|dentist|pharmacist|veterinarian|vet|optometrist)\b', "29", "29-1"]
  - ['\b(?:therapist|paramedic|emt|radiographer|lab technician|dietitian)\b', "29"]
  - ['\b(?:professor|lecturer)\b', "25", "25-1"]
  - ['\b(?:teacher|tutor|librarian|teaching assistant|instructor|educator)\b', "25"]
  - ['\b(?:lawyer|attorney|solicitor|barrister|judge)\b', "23", "23-1"]
  - ['\b(?:paralegal|legal assistant)\b', "23", "23-2"]
  - ['\b(?:engineer|architect|surveyor|drafter)\b', "17"]
  - ['\b(?:scientist|researcher|chemist|biologist|physicist|economist|psychologist|sociologist)\b', "19"]
  - ['\b(?:accountant|auditor|financial analyst|hr|human resources|recruiter|consultant|analyst|underwriter)\b', "13"]
  - ['\b(?:manager|director|ceo|cto|cfo|founder|executive|business owner|owner|entrepreneur|principal)\b', "11"]
  - ['\b(?:writer|journalist|designer|artist|musician|actor|actress|photographer|editor|translator|author|animator)\b', "27"]
  - ['\b(?:social worker|counselor|counsellor|clergy|pastor|priest|imam|rabbi)\b', "21"]
  - ['\b(?:police|firefighter|security guard|correctional|detective)\b', "33"]
  - ['\b(?:chef|cook|waiter|waitress|server|bartender|barista|dishwasher)\b', "35"]
  - ['\b(?:janitor|cleaner|housekeeper|landscap\w*|groundskeeper)\b', "37"]
  - ['\b(?:hairdresser|barber|nanny|childcare|babysitter|fitness trainer|personal trainer)\b', "39"]
  - ['\b(?:sales\w*|cashier|retail|real estate agent|realtor)\b', "41"]
  - ['\b(?:receptionist|secretary|clerk|administrative|admin|customer service|office|bookkeeper)\b', "43"]
  - ['\b(?:farmer|farm\w*|fisher\w*|forest\w*|rancher)\b', "45"]
  - ['\b(?:construction|carpenter|electrician|plumber|miner|roofer|mason)\b', "47"]
  - ['\b(?:mechanic|technician|repair\w*|maintenance)\b', "49"]
  - ['\b(?:factory|machinist|welder|assembl\w*|manufactur\w*)\b', "51"]
  - ['\b(?:driver|pilot|trucker|delivery|warehouse|courier|conductor)\b', "53"]
  - ['\b(?:soldier|military|army|navy|air force|marine|veteran)\b', "55"]
