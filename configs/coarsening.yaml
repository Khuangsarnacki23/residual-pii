# Deterministic coarsening maps for per-user profiles (src/residpii/profiles.py, Stage 2).
# Attribute values (labelling schema: human labels or the LLM detector) are matched after
# normalisation (lower-case, punctuation removed). Anything that does not match becomes `unknown`,
# so a free-text value can never make a user look unique on these dimensions.
# Employer, relationship, nationality/ethnicity, religion, political, income and health are mapped to
# broad categories by `category_keywords` (first match wins); unmatched values become `unknown`, or the
# attribute's `category_fallback` where one is set.
# These tables are deliberately small and English/US-centred; see docs/limitations.md.

age_band_years: 10
age_top_code: 80            # ages at or above this share one band

# "AB:name" pairs by US census region. Profiles keep the state.
