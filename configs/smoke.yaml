# Smoke test: ~100 conversations per dataset from the first few row groups of one file.
# The sample is NOT representative (early row groups only); it exists to exercise the pipeline.
extends: default.yaml
run_name: smoke

datasets:
  wildchat: {sample_size: 100}
  arena: {sample_size: 100}
  lmsys: {sample_size: 100}

scan:
  max_files: 1
  max_row_groups_per_file: 3

analysis:
  bootstrap_reps: 200
