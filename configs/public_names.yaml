# Names the rule-based sanitizer leaves alone (src/residpii/rules_sanitize.py). Written from general
# knowledge, not from the evaluation data. Matching is case-insensitive, ignores a trailing possessive
# ('s), and is on the whole name; a listed person's distinctive surname alone also matches
# ("Zuckerberg"). Deliberately incomplete and English-centred: extend freely. See docs/limitations.md.
#
# public_figures and fictional are always kept. placeholder names (example/template names) are kept.
# common_first_names are kept only when a single first name appears without a strong cue (a letter
# frame, "my name is", an honorific, "my boss X"): in "Dear Emma," it is still redacted.

